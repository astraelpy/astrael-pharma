<!DOCTYPE html>
<html>
<head>
    <title>Novo Produto</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>➕ Novo Produto</h1>

<form method="POST">
    <input type="text" name="nome" placeholder="Nome do produto" required><br><br>
    <input type="number" step="0.01" name="preco" placeholder="Preço" required><br><br>
    <input type="number" name="quantidade" placeholder="Quantidade" required><br><br>
    <button type="submit">Salvar Produto</button>
</form>

<br>
<a href="/admin">⬅ Voltar para o admin</a>

</body>
</html>
