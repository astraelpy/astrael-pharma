{% extends 'base.html' %}

{% block title %}Login - ASTRAEL PHARMA{% endblock %}

{% block content %}
<div class="login-box">
    <h2 style="text-align: center; margin-bottom: 0.5rem; color: var(--primary-color);">Acesso Restrito</h2>
    <p class="text-muted" style="text-align: center; margin-bottom: 2rem;">Faça login para gerenciar o estoque.</p>

    <form method="POST">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
        </div>
        
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Digite sua senha" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Entrar no Sistema</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{{ url_for('index') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">&larr; Voltar para a loja</a>
    </div>
</div>
{% endblock %}
